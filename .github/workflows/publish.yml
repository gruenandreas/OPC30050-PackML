# Build the STS XML and the browsable rendering on every check-in to main.
#
# This is the only workflow in the repository, and the only logic that runs against this
# specification lives in the tool it installs - nothing here is a script this repository
# carries, so a rule is fixed by a tool release rather than by the same edit repeated in
# every specification repository.
#
#     source/<spec>/manifest.json + source/<spec>/ + model/
#         -> Opc.Ua.SpecificationPublisher build     -> artifacts/   STS XML + NodeIds.csv, for machines
#         -> Opc.Ua.SpecificationPublisher publish   -> docs/        browsable HTML, for people
#                                                    -> artifacts/   the Word edition, beside the STS
#
# Every specification in the repository, in one run. A specification is a directory under
# source/ with a manifest beside its spec.md; adding one is adding a directory, and there is
# no list here to remember to update. artifacts/ is flat and holds all of them; docs/ mirrors
# source/, so each is published where it is authored, under a root index that lists them.
#
# STS is the hub. The browsable tree is rendered *from it*, not from the markdown source,
# and so is the Word submission. Two renderings of one interchange format cannot disagree
# with each other; two renderers reading the source independently certainly would.
#
# It also means the browsable tree is a standing check on the STS: if a clause, a table or a
# cross-reference cannot be reconstructed from the XML for a human to read, it was not
# carried, and that shows up as something visibly missing rather than as silence.
#
# docs/ is what GitHub Pages serves (main, /docs), so the rendering an author reviews is the
# one this workflow committed.
#
# Both commands run locally, identically — without the directory flags they write under
# _work/, which is gitignored, so a local rebuild does not dirty what is committed:
#
#     dotnet tool restore
#     dotnet Opc.Ua.SpecificationPublisher build
#     dotnet Opc.Ua.SpecificationPublisher publish

name: Publish

on:
  push:
    branches: [main]
    # Everything except what this workflow itself writes.
    #
    # An allowlist of source/, model/ and manifest.json was too narrow: bumping the tool pin,
    # changing this workflow, or editing AUTHORING.md all left the published document built by
    # some earlier run, and the only way to refresh it was to remember to press the button. A
    # check-in is the trigger; nothing here should need a person to notice.
    #
    # The exclusion is load-bearing rather than tidiness. This workflow commits to artifacts/
    # and docs/, and without it that commit starts the workflow again, forever. Push events
    # ignore a commit only when *every* changed path is excluded - which is exactly the shape
    # of the commit below, and not the shape of any commit a person makes.
    paths-ignore:
      - "artifacts/**"
      - "docs/**"
  workflow_dispatch:
  # The same build, run against the merge result before it is a merge.
  #
  # It is the whole job and not a subset: `build` refuses anything the STS cannot carry, the
  # render is a standing check that every clause survived the round trip, and the validator
  # step below reads the STS - so a pull request that goes green here is one whose document
  # publishes. Running a cut-down version would leave exactly the failures that only appear
  # on main, which is where they are most expensive.
  #
  # No paths-ignore. A pull request is reviewed as a whole, and a change to the tool pin or to
  # this workflow is a change to what the build does; the reason main filters those paths is
  # to stop its own commit retriggering it, and a pull request makes no such commit.
  pull_request:
    branches: [main]

# The tool version is not set here. `dotnet tool restore` below takes it from
# .config/dotnet-tools.json, so CI runs exactly the build an author has locally and moving to
# a new one is a reviewable commit to that file:
#
#     dotnet tool update OPCFoundation.Opc.Ua.SpecificationPublisher --version "1.0.*"
#
# There is no repository setting to check and nothing that can differ between a person's
# machine and this workflow.

permissions:
  contents: write
  pull-requests: write   # the fallback below opens and merges its own pull request
  pages: read            # to read the site URL for docs/README.md

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Tags, which the default shallow fetch does not bring. A manifest naming a baselineTag
      # asks publish to read the last released edition's STS out of that tag and render a
      # redline beside the document; without the tag in the checkout there is nothing to read,
      # and the failure would be a missing redline in CI only - green, and silently answering
      # nobody's question. A specification repository is markdown and XML, so its whole history
      # is cheap to fetch.
      #
      # Harmless where no manifest sets baselineTag: nothing asks for a tag and nothing reads
      # one. Narrow this to fetch-tags: true with a depth if the history ever gets expensive.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          
      - name: Install SpecificationPublisher Tools
        run: dotnet tool restore

      # The Word edition needs the SVG figures as rasters - Word will not show an SVG unless the
      # drawing also carries one - and the tool rasterises them with Skia, whose native library
      # links against fontconfig. Without it the figure is dropped and the publish stops.
      #
      # Installed rather than assumed: libfontconfig1 is not in the runner image's documented
      # package list, so a build that relies on it being there is relying on something no one
      # promised. It also brings the DejaVu fonts, without which the diagram labels rasterise
      # blank. Seconds when it is already present.
      #
      # The two font packages are why the figures come out of CI looking like the figures come
      # out of a laptop. draw.io labels name Calibri, Arial and Helvetica, none of which a
      # runner has: DejaVu answers for all three, it is about a quarter wider, and the labels
      # rasterise in the wrong face overrunning the boxes they sit in. Carlito and Liberation
      # are metric-compatible stand-ins - same advance widths as Calibri and as Arial and
      # Helvetica - so a line occupies the width the diagram was drawn for.
      #
      # It matters beyond the raster. A label that changes format partway through is measured
      # at build time to place its parts, and a measurement taken against a substitute a quarter
      # too wide is written into an SVG that still names Calibri - so Word, which has Calibri,
      # draws it from a position computed for a font it is not using. Metric-compatible fonts
      # make the measurement here agree with the one the reader's Word makes there.
      - name: Install fontconfig and the fonts the figures name
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libfontconfig1 \
            fonts-crosextra-carlito \
            fonts-liberation


      # A red main publishes nothing. The rules run on every pull request, but main can take
      # a direct push, and two pull requests that were each green can merge into a main that
      # is not. Keeping the last good rendering is better than replacing it with one built
      # from a document that does not validate.
      #
      # Checking the document against its NodeSets is a second tool,
      # Opc.Ua.SpecificationValidator, and it reads the STS rather than the markdown - so the
      # step sits after the build below rather than here. `build` itself already refuses
      # anything the STS cannot carry, which is why there is nothing to run at this point.

      # Both directories are entirely generated, and a rebuild only overwrites what it writes.
      # A specification that is renamed, moved to a different group or withdrawn would otherwise
      # keep its old pages on the published site forever - reachable, indexed, and indisputably
      # wrong. Emptying them first makes what is committed below exactly what this run produced.
      - name: Clear what the build regenerates
        run: rm -rf artifacts docs

      - name: Build STS XML
        run: dotnet Opc.Ua.SpecificationPublisher build --out artifacts/

      # Every table in the document against the NodeSets it describes: BrowseNames, DataTypes,
      # ModellingRules, references, attribute values, Conformance Units. Here rather than before
      # the build because it reads the STS, and before the commit so that a document which does
      # not validate leaves the previous run's artifacts/ and docs/ in place.
      #
      # Off by default, because it will have findings on a specification that has never been run
      # through it and a red main on the first push is not a useful welcome. Turning it on is two
      # edits: add OPCFoundation.Opc.Ua.SpecificationValidator to .config/dotnet-tools.json so
      # `dotnet tool restore` installs it, and uncomment this.
      #
      # One line per specification rather than a loop over artifacts/: each names the NodeSet it
      # describes, and which of the models in model/ is the primary one for a given document is
      # not derivable from the file names.
      #
      # - name: Validate against the NodeSets
      #   run: |
      #     dotnet Opc.Ua.SpecificationValidator validate \
      #       artifacts/<doc>.xml model/<primary>.NodeSet2.xml --dependency-dir model/dependencies

      - name: Render the browsable specification
        # Numbered clauses, materialised node tables, generated boilerplate, resolved
        # cross-references, and figures the reader can actually see. Nothing renders a
        # diagram here: figures are editable SVG, which is the picture and its source in one
        # file, and mermaid is emitted as a fenced block that GitHub draws itself.
        # Both directories are named explicitly. The tool defaults to _work/, which is
        # gitignored, so that a local rebuild does not dirty the committed artifacts — what
        # gets committed is decided here rather than by where the command is running.
        env:
          # Not exported automatically; a step has to ask for it. No PAT is involved - the
          # automatic token can read the Pages configuration given the permission above.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # A private Pages site has a randomised hostname, so it cannot be derived from the
          # repository name. If this cannot be read the publish still runs; docs/README.md then
          # explains the directory without linking to the page.
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)
          echo "Pages URL: ${url:-<unavailable>}"
          dotnet Opc.Ua.SpecificationPublisher publish --in artifacts/ --out docs/ ${url:+--site-url "$url"}

      - name: Commit what changed
        # Never on a pull request. Everything above this point is a check and writes only to the
        # runner; this step is the one that writes to the repository, and a pull request has no
        # business publishing. It would commit the merge result to the *base* branch - the
        # rendering of a document nobody has approved yet, landing on main ahead of the change
        # that produced it - and the push would fail anyway on a fork, whose token is read-only.
        #
        # The build output is still available on a pull request: the upload step below runs
        # unconditionally, so a reviewer can read the rendering this run produced without it
        # having been committed anywhere.
        if: ${{ github.event_name != 'pull_request' }}
        # This commit touches artifacts/ and docs/ and nothing else, which is precisely what
        # `paths-ignore` above excludes - so it does not retrigger the workflow.
        #
        # A protected default branch rejects this push, and the bypass list is not the way out
        # it used to be: the built-in GitHub Actions app generally cannot be added as a bypass
        # actor at all - the API refuses it with 422 unless the Integration belongs to the
        # ruleset's owning organisation, and the picker under Settings > Rules > Rulesets often
        # offers no apps to choose from. Registering a GitHub App per organisation would work,
        # and is exactly the per-repository setup this workflow exists to avoid.
        #
        # So a refusal is not the end of the publish. Merging a pull request *satisfies* "require
        # a pull request before merging" rather than circumventing it, and with required approvals
        # at 0 the ordinary workflow token can open one and merge it unattended. Reviewers still
        # gate everything a person writes; what goes round review is a commit confined to two
        # directories that are entirely generated and that the next build discards.
        #
        # The direct push is still tried first. An unprotected repository should not pay for a
        # branch, a pull request and a merge to publish two generated directories, and most
        # repositories carrying a specification are not protected.
        #
        # Three different things refuse that push and they are not the same thing.
        #
        # A branch that moved is a race. main takes a merge whenever one is approved, so a run
        # that started before that merge finds the tip has changed by the time it pushes.
        # Rebasing replays this commit onto the new tip and the next attempt succeeds.
        #
        # A branch that moved *and* whose new tip already carries a rebuild is not a race worth
        # winning: the run that merge triggered has published a rendering of newer sources than
        # this one built from. That shows up as a rebase conflict in artifacts/ or docs/, and the
        # right answer is to stand down rather than to overwrite a newer rendering with an older
        # one. Standing down is a success - something published, just not this run.
        #
        # A branch that refuses every direct push is protection. That refusal is permanent and no
        # number of retries clears it, so it is not retried at all: it goes straight to the pull
        # request path, which is the supported way to write to such a branch.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Actions starts this shell as `bash -e {0}`, so errexit is already on and is left on:
          # it is what catches the unchecked git commands below. It cannot simply be turned off
          # either, because then a failed commit would sail on into the publish.
          #
          # The one call that must survive a non-zero return is direct_push, whose return value is
          # a result and not a failure. Calling it through `||` is what exempts it - errexit kills
          # the shell on a bare `direct_push` before the case statement is ever reached, which
          # reports the function's own return code as the step's exit code.
          set -uo pipefail

          # One long-lived branch, force-pushed, rather than a branch per run. A run whose merge
          # is refused leaves its pull request open for someone to merge by hand, and a fixed name
          # means the next run updates that pull request instead of stacking another one behind it.
          PUBLISH_BRANCH="spec-publish"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ docs/
          if git diff --cached --quiet; then
            echo "The build is already in step with the sources; nothing to commit."
            exit 0
          fi
          git commit -m "Rebuild STS and the browsable specification from ${GITHUB_SHA::8}

          Generated by .github/workflows/publish.yml. Edit source/, model/ or
          manifest.json — never artifacts/ or docs/, which the next build discards."

          # 0 published, 2 the branch takes no direct push, 1 anything else. Standing down on a
          # newer rebuild leaves the step outright rather than returning, because it settles the
          # whole publish and not just this attempt.
          direct_push() {
            for attempt in 1 2 3; do
              if output=$(git push 2>&1); then
                echo "${output}"
                echo "Published on attempt ${attempt}."
                return 0
              fi
              echo "${output}"

              case "${output}" in
                *GH006*|*GH013*|*"protected branch"*|*"Changes must be made through a pull request"*)
                  return 2
                  ;;
              esac

              if [ "${attempt}" -eq 3 ]; then
                return 1
              fi

              echo "Push refused on attempt ${attempt}; checking whether ${GITHUB_REF_NAME} has moved."
              if ! git fetch origin "${GITHUB_REF_NAME}"; then
                echo "::error::Cannot reach origin to find out. Failing rather than retrying blindly."
                return 1
              fi

              if ! git rebase "origin/${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::notice::${GITHUB_REF_NAME} already carries a newer rebuild; standing down."
                echo "The run that published it built from sources newer than this one did, so"
                echo "replacing its rendering with this one would move the site backwards."
                exit 0
              fi
            done
            return 1
          }

          rc=0
          direct_push || rc=$?
          case ${rc} in
            0) exit 0 ;;
            2) echo "::notice::${GITHUB_REF_NAME} takes no direct push; publishing through a pull request." ;;
            *)
              echo "::error::Could not push the rebuilt artifacts/ and docs/ to ${GITHUB_REF_NAME}."
              exit 1
              ;;
          esac

          # Protection was refused on the first attempt, so nothing has been rebased yet. The pull
          # request is opened against the tip as it is now rather than as it was when the build
          # started, so that a merge conflict later means a genuinely newer rebuild and not a base
          # that simply went stale while the figures rasterised.
          if git fetch origin "${GITHUB_REF_NAME}"; then
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::notice::${GITHUB_REF_NAME} already carries a newer rebuild; standing down."
              exit 0
            fi
          else
            echo "::warning::Could not fetch ${GITHUB_REF_NAME}; opening the pull request against the"
            echo "base this run checked out. If it has moved since, the merge below reports a conflict"
            echo "rather than merging something built from a stale tree."
          fi

          # Force, because this branch is a transport and not a history: whatever a refused earlier
          # run left on it describes an older build than the one in hand.
          if ! git push --force origin "HEAD:refs/heads/${PUBLISH_BRANCH}"; then
            echo "::error::Could not create ${PUBLISH_BRANCH}, so the pull request path is closed too."
            echo "A ruleset that targets refs/heads/* rather than just ${GITHUB_REF_NAME} blocks this;"
            echo "narrow it to the default branch."
            exit 1
          fi

          # Reuse the open pull request if this branch already has one. gh pr create fails rather
          # than returning it, and the run that opened it may simply not have been able to merge.
          if ! pr=$(gh pr list --head "${PUBLISH_BRANCH}" --base "${GITHUB_REF_NAME}" \
                      --state open --json number --jq '.[0].number // empty'); then
            echo "::error::Could not list the pull requests on ${PUBLISH_BRANCH}."
            exit 1
          fi

          if [ -z "${pr}" ]; then
            if ! gh pr create \
                   --base "${GITHUB_REF_NAME}" \
                   --head "${PUBLISH_BRANCH}" \
                   --title "Rebuild STS and the browsable specification" \
                   --body "artifacts/ and docs/ rebuilt from ${GITHUB_SHA::8} by .github/workflows/publish.yml. Both directories are generated in full by every run and the next build discards whatever is in them, so there is nothing here to read line by line. ${GITHUB_REF_NAME} takes no direct push, which is the only reason this is a pull request."; then
              echo "::error::Could not open a pull request from ${PUBLISH_BRANCH}."
              echo "Settings > Actions > General > Workflow permissions:"
              echo "  tick 'Allow GitHub Actions to create and approve pull requests'."
              exit 1
            fi
            pr=$(gh pr list --head "${PUBLISH_BRANCH}" --base "${GITHUB_REF_NAME}" \
                   --state open --json number --jq '.[0].number // empty') || pr=""
            if [ -z "${pr}" ]; then
              echo "::error::Opened a pull request from ${PUBLISH_BRANCH} but could not read its number."
              exit 1
            fi
          fi

          # The merge endpoint directly, never `gh pr merge --auto`. Auto-merge defers the merge,
          # and the deferred path has been reported not to re-read a ruleset's bypass actors when
          # it finally runs - so a repository that merges perfectly well by hand silently never
          # merges by itself. Squash rather than a merge commit, so a ruleset requiring linear
          # history is satisfied too and main gains one commit per rebuild.
          if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pulls/${pr}/merge" \
               -f merge_method=squash \
               -f commit_title="Rebuild STS and the browsable specification from ${GITHUB_SHA::8}" \
               -f commit_message="Generated by .github/workflows/publish.yml."; then
            echo "Published through pull request #${pr}."
            # The squashed commit touches artifacts/ and docs/ and nothing else, which is what
            # paths-ignore at the top excludes - so it does not start this workflow again.
            git push origin --delete "${PUBLISH_BRANCH}" || true
            exit 0
          fi

          echo "::error::Pull request #${pr} was opened but could not be merged."
          echo "It is left open, so the rebuild is not lost and a reviewer can merge it by hand."
          echo
          echo "For it to merge unattended, on the ruleset covering ${GITHUB_REF_NAME}:"
          echo "  - Required approvals must be 0. A bot cannot approve its own pull request, and"
          echo "    'bypass required pull requests' covers Code Owners review, not the approval count."
          echo "  - No required status checks. A pull request opened with the workflow token does not"
          echo "    start workflows, so a required check never reports and the merge waits forever."
          echo "  - The ruleset must target ${GITHUB_REF_NAME} only, not refs/heads/*."
          echo
          echo "Settings > Rules > Rulesets. Adding GitHub Actions to the bypass list is not an"
          echo "alternative: the built-in Actions app generally cannot be added as a bypass actor."
          exit 1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: specification
          path: |
            artifacts/
            docs/
          if-no-files-found: warn
